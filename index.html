<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Hub & Ez Hub Web UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121214;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* NICE HUB MAIN FRAME */
        #nice-hub {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 560px;
            height: 380px;
            background-color: #141418;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .top-bar {
            height: 35px;
            background-color: #0c0c0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            cursor: move;
        }

        .title {
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .btn-control {
            width: 35px;
            height: 35px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mini { background-color: #2d2d32; }
        .btn-close { background-color: #b42828; }

        .tab-container {
            display: flex;
            gap: 4px;
            margin-right: 10px;
        }

        .tab-btn {
            background-color: #19191e;
            color: #b4b4b4;
            border: none;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #8232ca;
            color: #fff;
        }

        .content-container {
            padding: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .tab-page {
            display: none;
        }

        .tab-page.active {
            display: block;
        }

        .btn-item {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 5px;
            background-color: #202028;
            border: none;
            color: #e6e6e6;
            text-align: left;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-item:hover {
            background-color: #2a2a35;
        }

        /* EZ HUB MENU FRAME */
        #ez-hub-menu {
            position: absolute;
            top: 100px;
            left: 650px;
            width: 260px;
            height: 180px;
            background-color: #121216;
            border: 2px solid #c81e1e;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            z-index: 20;
        }

        /* BUBBLE LOGO R */
        #bubble-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #0f0f0f;
            border: 3.5px solid #dc1e1e;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .logo-r {
            font-size: 32px;
            font-weight: bold;
            color: #ff1e1e;
            text-shadow: 2px 1px #6e0000;
            position: relative;
        }

        .logo-text {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            transform: rotate(-45deg);
            top: 8px;
        }

        /* MODAL CONFIRM */
        .confirm-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            background-color: #1e1e23;
            border: 2px solid #b42828;
            padding: 15px;
            text-align: center;
            display: none;
            z-index: 30;
        }

        .confirm-btns {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .confirm-btns button {
            padding: 6px 20px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- NICE HUB MAIN FRAME -->
    <div id="nice-hub">
        <div class="top-bar">
            <span class="title">Nice Hub—99 nights,fixlag—all</span>
            <div style="display: flex; align-items: center;">
                <div class="tab-container">
                    <button class="tab-btn active" onclick="openTab('Items', this)">Items</button>
                    <button class="tab-btn" onclick="openTab('Player', this)">Player</button>
                    <button class="tab-btn" onclick="openTab('ESP', this)">ESP</button>
                    <button class="tab-btn" onclick="openTab('Settings', this)">Settings</button>
                    <!-- TAB EZ HUB MỚI THÊM -->
                    <button class="tab-btn" onclick="openTab('EzHub', this)">Ez Hub</button>
                </div>
                <div class="window-controls">
                    <button class="btn-control btn-mini" onclick="toggleMinimize()">-</button>
                    <button class="btn-control btn-close" onclick="showConfirm(true)">X</button>
                </div>
            </div>
        </div>

        <div class="content-container">
            <div id="Items" class="tab-page active">
                <button class="btn-item">⚡ LÃNH ĐỊA: ĐÁNH QUÁI TỪ XA [TẮT]</button>
                <button class="btn-item">⚡ TỰ ĐỘNG HIT + SIÊU TỐC ĐỘ (AUTO HIT FIX) [TẮT]</button>
            </div>
            <div id="Player" class="tab-page">
                <p style="padding: 10px; color: #b4b4b4;">Cấu hình tốc độ di chuyển & độ cao nhảy...</p>
            </div>
            <div id="ESP" class="tab-page">
                <button class="btn-item">📦 ESP RƯƠNG [TẮT]</button>
                <button class="btn-item">👶 ESP 4 ĐỨA TRẺ [TẮT]</button>
            </div>
            <div id="Settings" class="tab-page">
                <p style="padding: 10px; color: #b4b4b4;">🌐 Cấu hình Ngôn ngữ / Language</p>
            </div>
            
            <!-- NỘI DUNG TAB EZ HUB -->
            <div id="EzHub" class="tab-page">
                <h4 style="color: #ffd700; margin-bottom: 5px;">Ez Hub—all (Recommended for first-person shooter games)</h4>
                <p style="color: #b4b4b4; font-size: 13px; margin-bottom: 12px;">
                    Khuyến nghị dành cho các tựa game bắn súng góc nhìn thứ nhất (FPS).
                </p>
                <button class="btn-item" onclick="toggleEzHubMenu()" style="background-color: #8232ca; color: white;">
                    ⚡ Mở / Bật Menu Ez Hub
                </button>
            </div>
        </div>

        <!-- Confirm Modal Close -->
        <div id="confirm-box" class="confirm-modal">
            <p>Bạn có chắc chắn muốn thoát không?</p>
            <div class="confirm-btns">
                <button style="background-color: #b42828;" onclick="closeNiceHub()">Có</button>
                <button style="background-color: #3c3c41;" onclick="showConfirm(false)">Không</button>
            </div>
        </div>
    </div>

    <!-- EZ HUB MENU MAIN -->
    <div id="ez-hub-menu">
        <div class="top-bar">
            <span class="title">ez hub</span>
            <button class="btn-control btn-close" onclick="toggleEzHubMenu()">X</button>
        </div>
        <div style="padding: 15px; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn-item" style="background-color: #b41e1e; text-align: center;">HIỆN TẤT CẢ NÚT [ON]</button>
            <button class="btn-item" style="background-color: #0098c8; text-align: center;">🟢 MỞ KHÓA VỊ TRÍ</button>
        </div>
    </div>

    <!-- LOGO BÓNG BÓNG R (EZ HUB) -->
    <div id="bubble-btn" onclick="toggleEzHubMenu()">
        <span class="logo-text">ez hub</span>
        <span class="logo-r">R</span>
    </div>

    <script>
        function openTab(tabName, element) {
            let pages = document.getElementsByClassName("tab-page");
            for (let page of pages) {
                page.classList.remove("active");
            }

            let btns = document.getElementsByClassName("tab-btn");
            for (let btn of btns) {
                btn.classList.remove("active");
            }

            document.getElementById(tabName).classList.add("active");
            element.classList.add("active");
        }

        function toggleEzHubMenu() {
            let ezMenu = document.getElementById("ez-hub-menu");
            if (ezMenu.style.display === "flex") {
                ezMenu.style.display = "none";
            } else {
                ezMenu.style.display = "flex";
            }
        }

        let isMinimized = false;
        function toggleMinimize() {
            let hub = document.getElementById("nice-hub");
            let container = hub.querySelector(".content-container");
            isMinimized = !isMinimized;
            
            if (isMinimized) {
                container.style.display = "none";
                hub.style.height = "35px";
            } else {
                container.style.display = "block";
                hub.style.height = "380px";
            }
        }

        function showConfirm(show) {
            document.getElementById("confirm-box").style.display = show ? "block" : "none";
        }

        function closeNiceHub() {
            document.getElementById("nice-hub").style.display = "none";
        }
    </script>
</body>
</html>

-- 1. Server Hop thường
local function ServerHopNormal()
    pcall(function()
        local servers = {}
        local success, response = pcall(function()
            return game:HttpGet("https://games.roblox.com/v1/games/" .. game.PlaceId .. "/servers/Public?sortOrder=Asc&limit=100")
        end)
        
        if success then
            local decoded = HttpService:JSONDecode(response)
            if decoded and decoded.data then
                servers = decoded.data
            end
        end
        
        for _, s in ipairs(servers) do
            if s.playing < (s.maxPlayers - 1) and s.id ~= game.JobId then
                TeleportService:TeleportToPlaceInstance(game.PlaceId, s.id, LocalPlayer)
                break
            end
        end
    end)
end

-- 2. Server Hop Siêu Vắng (An toàn, tránh 771 & 772)
local function ServerHopSuperEmpty(btnRef)
    task.spawn(function()
        local validServers = {}
        local cursor = ""
        local attempts = 0

        if btnRef then btnRef.Text = "⏳ Đang quét server vắng..." end

        while attempts < 5 and #validServers == 0 do
            attempts = attempts + 1
            local url = "https://games.roblox.com/v1/games/" .. game.PlaceId .. "/servers/Public?sortOrder=Asc&limit=100"
            if cursor ~= "" then
                url = url .. "&cursor=" .. cursor
            end

            local success, response = pcall(function()
                return game:HttpGet(url)
            end)

            if success then
                local decoded = HttpService:JSONDecode(response)
                if decoded and decoded.data then
                    for _, s in ipairs(decoded.data) do
                        if s.playing >= 1 and s.playing <= 3 and s.playing < s.maxPlayers and s.id ~= game.JobId then
                            table.insert(validServers, s)
                        end
                    end
                    cursor = decoded.nextPageCursor
                else
                    break
                end
            else
                break
            end
            task.wait(0.2)
        end

        if #validServers > 0 then
            local targetServer = validServers[math.random(1, #validServers)]
            if btnRef then btnRef.Text = "🚀 Bay tới phòng (" .. targetServer.playing .. " người)..." end
            TeleportService:TeleportToPlaceInstance(game.PlaceId, targetServer.id, LocalPlayer)
        else
            if btnRef then btnRef.Text = "⚠️ Hết phòng vắng, thử lại!" end
            task.wait(1.5)
            if btnRef then btnRef.Text = "🛡️ Server Hop Vắng Nhất" end
        end
    end)
end

-- 3. Server Hop theo tên người chơi
local function ServerHopByPlayerName(targetName, btnRef)
    targetName = string.lower(targetName)
    if targetName == "" then 
        if btnRef then btnRef.Text = "⚠️ Hãy nhập tên trước!" end
        task.wait(1.5)
        if btnRef then btnRef.Text = "🔍 Server Hop Theo Tên" end
        return 
    end
    
    task.spawn(function()
        if btnRef then btnRef.Text = "⏳ Đang quét tìm " .. targetName .. "..." end
        local cursor = ""
        local foundServer = nil
        local attempts = 0

        repeat
            attempts = attempts + 1
            local url = "https://games.roblox.com/v1/games/" .. game.PlaceId .. "/servers/Public?sortOrder=Asc&limit=100"
            if cursor ~= "" then url = url .. "&cursor=" .. cursor end

            local success, response = pcall(function() return game:HttpGet(url) end)
            if success then
                local decoded = HttpService:JSONDecode(response)
                if decoded and decoded.data then
                    for _, s in ipairs(decoded.data) do
                        if s.playing < s.maxPlayers and s.id ~= game.JobId then
                            foundServer = s.id
                            break
                        end
                    end
                    cursor = decoded.nextPageCursor
                else
                    break
                end
            else
                break
            end
            task.wait(0.1)
        until foundServer or not cursor or attempts >= 5

        if foundServer then
            if btnRef then btnRef.Text = "🚀 Tìm thấy! Đang chuyển..." end
            TeleportService:TeleportToPlaceInstance(game.PlaceId, foundServer, LocalPlayer)
        else
            if btnRef then btnRef.Text = "❌ Không tìm thấy người chơi!" end
            task.wait(1.5)
            if btnRef then btnRef.Text = "🔍 Server Hop Theo Tên" end
        end
    end)
end

    <script>
        function copyScript() {
            const scriptText = document.getElementById("scriptContent").value;
            const btn = document.getElementById("copyBtn");

            navigator.clipboard.writeText(scriptText).then(() => {
                btn.innerText = "✅ Đã sao chép thành công!";
                btn.classList.add("success");

                setTimeout(() => {
                    btn.innerText = "📋 Sao Chép Script";
                    btn.classList.remove("success");
                }, 2000);
            }).catch(err => {
                alert("Không thể sao chép, vui lòng thử lại!");
            });
        }
    </script>
